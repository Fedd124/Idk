<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Animated Dancer</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 25%,#26304a 0%,#111522 45%,#06070b 100%);
  font-family:Arial,sans-serif;
}

/* FLOOR */

.floor{
  position:absolute;
  bottom:0;
  left:0;
  width:100%;
  height:25vh;
  background:
    linear-gradient(90deg,
      transparent 0 48%,
      rgba(255,255,255,.04) 50%,
      transparent 52%);
  border-top:1px solid rgba(255,255,255,.08);
  transform:perspective(500px) rotateX(55deg);
  transform-origin:top;
}

/* STAGE LIGHT */

.light{
  position:absolute;
  width:500px;
  height:500px;
  left:50%;
  top:-180px;
  transform:translateX(-50%);
  background:radial-gradient(
    ellipse,
    rgba(190,220,255,.17),
    transparent 65%
  );
  filter:blur(10px);
}

/* DANCER */

.dancer{
  position:absolute;
  left:50%;
  bottom:19vh;
  width:180px;
  height:430px;
  transform:translateX(-50%);
}

/* HEAD */

.head{
  position:absolute;
  width:76px;
  height:86px;
  left:52px;
  top:0;
  background:#d89b78;
  border-radius:45% 45% 48% 48%;
  z-index:5;
  box-shadow:
    inset -8px -5px 0 rgba(0,0,0,.08);
}

/* HAIR */

.hair{
  position:absolute;
  width:84px;
  height:105px;
  left:48px;
  top:-12px;
  background:#241912;
  border-radius:50% 50% 42% 42%;
  z-index:6;
}

.hair::after{
  content:"";
  position:absolute;
  width:28px;
  height:75px;
  right:-8px;
  top:35px;
  background:#241912;
  border-radius:0 0 30px 30px;
}

/* FACE */

.eye{
  position:absolute;
  width:6px;
  height:6px;
  background:#17110e;
  border-radius:50%;
  top:39px;
  z-index:8;
}

.eye.left{left:71px}
.eye.right{left:101px}

.mouth{
  position:absolute;
  left:82px;
  top:58px;
  width:17px;
  height:7px;
  border-bottom:2px solid #7d4035;
  border-radius:50%;
  z-index:8;
}

/* NECK */

.neck{
  position:absolute;
  width:25px;
  height:30px;
  left:77px;
  top:74px;
  background:#d89b78;
  z-index:3;
}

/* BODY / SHIRT */

.torso{
  position:absolute;
  width:82px;
  height:125px;
  left:48px;
  top:91px;
  background:#090a0d;
  border-radius:24px 24px 17px 17px;
  z-index:4;
  box-shadow:
    inset 5px 0 rgba(255,255,255,.035);
}

/* WAIST */

.waist{
  position:absolute;
  width:72px;
  height:32px;
  left:53px;
  top:202px;
  background:#0a0b0e;
  z-index:4;
}

/* LEGS */

.leg{
  position:absolute;
  width:30px;
  height:145px;
  top:225px;
  background:#111318;
  border-radius:18px;
  z-index:2;
  transform-origin:top center;
}

.leg.left{
  left:57px;
}

.leg.right{
  left:94px;
}

/* SHOES */

.shoe{
  position:absolute;
  width:53px;
  height:20px;
  background:#eee;
  border-radius:15px 17px 7px 7px;
  top:358px;
  z-index:3;
}

.shoe.left{
  left:33px;
}

.shoe.right{
  left:96px;
}

/* ARMS */

.arm{
  position:absolute;
  width:24px;
  height:125px;
  background:#d89b78;
  border-radius:18px;
  top:99px;
  transform-origin:top center;
  z-index:3;
}

.arm.left{
  left:38px;
}

.arm.right{
  left:116px;
}

/* HANDS */

.hand{
  position:absolute;
  width:22px;
  height:24px;
  background:#d89b78;
  border-radius:50%;
}

/* ======================
   DANCE ANIMATION
====================== */

.dancer{
  animation:
    bounce .75s ease-in-out infinite alternate;
}

.torso{
  animation:
    bodyMove .75s ease-in-out infinite alternate;
}

.head{
  animation:
    headMove .75s ease-in-out infinite alternate;
}

.arm.left{
  animation:
    leftArm 1.1s ease-in-out infinite alternate;
}

.arm.right{
  animation:
    rightArm 1.1s ease-in-out infinite alternate;
}

.leg.left{
  animation:
    leftLeg .9s ease-in-out infinite alternate;
}

.leg.right{
  animation:
    rightLeg .9s ease-in-out infinite alternate;
}

.shoe.left{
  animation:
    leftFoot .9s ease-in-out infinite alternate;
}

.shoe.right{
  animation:
    rightFoot .9s ease-in-out infinite alternate;
}

/* BODY */

@keyframes bounce{
  from{
    transform:translateX(-50%) translateY(0);
  }
  to{
    transform:translateX(-50%) translateY(-15px);
  }
}

@keyframes bodyMove{
  from{
    transform:rotate(-2deg);
  }
  to{
    transform:rotate(2deg);
  }
}

@keyframes headMove{
  from{
    transform:rotate(-4deg);
  }
  to{
    transform:rotate(4deg);
  }
}

/* ARMS */

@keyframes leftArm{
  from{
    transform:rotate(25deg);
  }
  to{
    transform:rotate(-55deg);
  }
}

@keyframes rightArm{
  from{
    transform:rotate(-25deg);
  }
  to{
    transform:rotate(55deg);
  }
}

/* LEGS */

@keyframes leftLeg{
  from{
    transform:rotate(7deg);
  }
  to{
    transform:rotate(-13deg);
  }
}

@keyframes rightLeg{
  from{
    transform:rotate(-7deg);
  }
  to{
    transform:rotate(13deg);
  }
}

/* FEET */

@keyframes leftFoot{
  from{
    transform:translateX(0) rotate(0);
  }
  to{
    transform:translateX(-8px) rotate(-8deg);
  }
}

@keyframes rightFoot{
  from{
    transform:translateX(0) rotate(0);
  }
  to{
    transform:translateX(8px) rotate(8deg);
  }
}

/* MUSIC VISUALIZER */

.visualizer{
  position:absolute;
  bottom:30px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:5px;
  align-items:end;
  height:35px;
}

.bar{
  width:5px;
  height:10px;
  background:#b8ff3d;
  border-radius:5px;
  animation:bars .6s ease-in-out infinite alternate;
}

.bar:nth-child(2){animation-delay:.1s}
.bar:nth-child(3){animation-delay:.2s}
.bar:nth-child(4){animation-delay:.3s}
.bar:nth-child(5){animation-delay:.15s}
.bar:nth-child(6){animation-delay:.25s}

@keyframes bars{
  from{height:6px}
  to{height:32px}
}

/* TITLE */

.title{
  position:absolute;
  top:30px;
  width:100%;
  text-align:center;
  color:white;
  font-size:14px;
  font-weight:bold;
  letter-spacing:3px;
  opacity:.7;
}

/* MOBILE */

@media(max-height:650px){
  .dancer{
    transform:translateX(-50%) scale(.78);
    transform-origin:bottom center;
  }
}

</style>
</head>

<body>

<div class="title">
  DANCE MODE
</div>

<div class="light"></div>
<div class="floor"></div>

<div class="dancer">

  <!-- HEAD -->
  <div class="hair"></div>

  <div class="head"></div>

  <div class="eye left"></div>
  <div class="eye right"></div>

  <div class="mouth"></div>

  <!-- NECK -->
  <div class="neck"></div>

  <!-- BODY -->
  <div class="torso"></div>
  <div class="waist"></div>

  <!-- ARMS -->
  <div class="arm left"></div>
  <div class="arm right"></div>

  <!-- LEGS -->
  <div class="leg left"></div>
  <div class="leg right"></div>

  <!-- SHOES -->
  <div class="shoe left"></div>
  <div class="shoe right"></div>

</div>

<!-- MUSIC VISUALIZER -->

<div class="visualizer">
  <div class="bar"></div>
  <div class="bar"></div>
  <div class="bar"></div>
  <div class="bar"></div>
  <div class="bar"></div>
  <div class="bar"></div>
</div>

</body>
</html>
